[package]
name = "ble-central-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8.6"
config = "0.15.18"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["fs"] }
tracing-subscriber = "0.3.20"

[dev-dependencies]
anyhow = "1.0.95"
axum-test = "16.4.1"
http-body-util = "0.1.2"
tower = "0.5.2"
