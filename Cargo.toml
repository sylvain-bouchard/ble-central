[package]
name = "ble-central-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
async-trait = "0.1.89"
axum = "0.8.6"
btleplug = "0.11.8"
config = "0.15.18"
dotenvy = "0.15.7"
futures = "0.3.31"
rumqttc = "0.25.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
tokio = { version = "1.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3.20"

[dev-dependencies]
anyhow = "1.0.95"
axum-test = "18.2.1"
http-body-util = "0.1.2"
tower = "0.5.2"
