[api]
host = '0.0.0.0'
port = 8080
log_level = 'info'

[mqtt]
broker = 'localhost'
port = 1883
client_id = 'ble_to_mqtt_bridge'
keep_alive_secs = 5
topic = 'living_room/air_quality/data'
manufacturer_id = 0xFFFF  # 65535 in decimal

[ble]
enable_scan = true
scan_auto_start = true
connection_timeout_secs = 10
observer_timeout_secs = 5
