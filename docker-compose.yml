version: "3.8"

services:
  ble-central-gateway:
    build: .
    image: ble-central-gateway:latest
    container_name: ble-central-gateway
    privileged: true
    network_mode: host
    volumes:
      - /run/dbus:/run/dbus
      - /var/run/dbus:/var/run/dbus
      - /sys/class/bluetooth:/sys/class/bluetooth
    environment:
      - RUST_BACKTRACE=1
    restart: unless-stopped
